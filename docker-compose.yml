# PictShare - local / development setup
#
# Builds the image from this checkout and mounts the source tree, so code changes are live.
# All settings come from .env (see .env.example for every option):
#
#   cp .env.example .env
#   docker compose up --build        # http://localhost:8080/
#
# Run the tests:
#   docker compose run --rm pictshare \
#     php /app/public/src/lib/vendor/bin/phpunit --configuration /app/public/phpunit.xml
#
# To run the published image instead of building it, replace the `build:` block with
#   image: ghcr.io/hascheksolutions/pictshare:3
# and remove the source mounts (src, web, tests, phpunit.xml) from `volumes:`.

services:
  pictshare:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - path: .env
        required: false   # starts with built-in defaults if there is no .env yet
    environment:
      # Fallback so the app works without a .env. A URL set in .env wins.
      - URL=${URL:-http://localhost:8080/}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./data:/app/public/data
      - ./logs:/app/public/logs
      - ./tmp:/app/public/tmp
      - ./tmp/redis:/var/lib/redis # can be removed if REDIS_CACHING=false
      # development: live source
      - ./src:/app/public/src
      - ./web:/app/public/web
      - ./tests:/app/public/tests
      - ./phpunit.xml:/app/public/phpunit.xml

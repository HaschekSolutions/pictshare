<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <style>.box { fill: #3366ff; }</style>
  <rect class="box" width="50" height="50" x="10" y="10">
    <animate attributeName="x" from="10" to="40" dur="2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="70" cy="70" r="20" fill="red">
    <animateTransform attributeName="transform" type="rotate" from="0 70 70" to="360 70 70" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
